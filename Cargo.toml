[package]
name = "friday-rust-assistant"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.9.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
cpal = "0.15.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
rdev = "0.5.3"
tray-icon = "0.14.3"
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi"
] }
sysinfo = "0.30"

[build-dependencies]
slint-build = "1.9.0"